name: macOS preview

on:
  push:
    paths: ['native/macos/**', 'packaging/build_macos.py', '.github/workflows/macos.yml']
  pull_request:
    paths: ['native/macos/**', 'packaging/build_macos.py', '.github/workflows/macos.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-preview:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test native configuration and readiness
        run: swift test --package-path native/macos
      - name: Build and verify arm64 app bundle
        run: python3 packaging/build_macos.py
      - name: Verify Apple Silicon architecture
        run: lipo -verify_arch arm64 'dist/VPN Splitter Preview.app/Contents/MacOS/VPNSplitterPreview'
