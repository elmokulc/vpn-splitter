name: macOS preview

on:
  push:
    paths: ['native/macos/**', 'packaging/build_macos.py', 'Makefile', '.github/workflows/macos.yml']
  pull_request:
    paths: ['native/macos/**', 'packaging/build_macos.py', 'Makefile', '.github/workflows/macos.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-preview:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test native configuration, signatures and laboratory flow policy
        run: make macos-lab
      - name: Build and verify arm64 app bundle
        run: python3 packaging/build_macos.py
      - name: Verify Apple Silicon architecture
        run: lipo 'dist/VPN Splitter Preview.app/Contents/MacOS/VPNSplitterPreview' -verify_arch arm64
